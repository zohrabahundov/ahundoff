<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <meta name="robots" content="noindex, follow">
    <title>Страница не найдена — Ahundoff</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2">
    <link rel="stylesheet" href="/styles.css?v=2026-11-21-7">
    <style>
        .error-page { min-height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center; padding: 2rem; }
        .error-page__code { font-family: var(--font-display); font-size: clamp(4rem, 18vw, 9rem); font-weight: 700; line-height: 1; color: var(--accent); }
        .error-page__title { font-size: 1.5rem; margin: 1rem 0 0.75rem; color: var(--text-primary); }
        .error-page__text { color: var(--text-secondary); max-width: 420px; margin: 0 auto 2rem; line-height: 1.6; }
        .error-page__actions { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; }
    </style>
</head>
<body>
    <main class="error-page">
        <div>
            <div class="error-page__code">404</div>
            <h1 class="error-page__title">Страница не найдена</h1>
            <p class="error-page__text">Возможно, она была перемещена или удалена. Вернитесь на главную или сразу обсудим ваш проект.</p>
            <div class="error-page__actions">
                <a href="/" class="btn btn--primary">На главную</a>
                <a href="/#contact" class="btn btn--secondary">Обсудить проект</a>
            </div>
        </div>
    </main>
</body>
</html>
